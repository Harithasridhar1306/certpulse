name: Refresh dynamic question bank

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate resource-grounded questions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          QUESTIONS_PER_CERT: 12
        run: node scripts/refresh-bank.mjs

      - name: Commit refreshed question bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exams.json
          if git diff --cached --quiet; then
            echo "No question-bank changes."
          else
            git commit -m "chore: refresh resource-grounded questions"
            git push
          fi
