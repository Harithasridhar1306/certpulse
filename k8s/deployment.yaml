apiVersion: apps/v1
kind: Deployment
metadata:
  name: certpulse-api
  labels:
    app: certpulse-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: certpulse-api
  template:
    metadata:
      labels:
        app: certpulse-api
    spec:
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT_ID/certpulse/certpulse-api:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: certpulse-api
spec:
  selector:
    app: certpulse-api
  ports:
    - port: 80
      targetPort: 8080
